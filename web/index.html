<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="pitwall-token" content="__PITWALL_TOKEN__">
  <title>Pitwall</title>
  <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="stage">
    <main id="panel" class="panel" aria-label="Pitwall panel">
      <header class="hdr" id="hdr"></header>
      <div class="grid" id="grid"></div>
      <footer class="ftr" id="ftr"></footer>
      <div class="offline" id="offline" hidden></div>
    </main>
  </div>
  <div id="controls" hidden></div>
  <div id="palette" class="palette" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
